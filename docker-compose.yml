# ============================================================================
# 渡口 Ferry · Docker Compose 编排
# ----------------------------------------------------------------------------
# 用法：
#   cp .env.example .env      # 填写 MYSQL_ROOT_PASSWORD / DB_PASSWORD / JWT_SECRET
#   docker compose up -d --build
#   前端 http://localhost:8088
#
# 四个服务：mysql（含建表与种子数据初始化） -> redis（向量库） -> backend -> frontend
#
# 几个刻意的设计选择，改动前请先读：
#   1. depends_on 全部带 condition: service_healthy。
#      普通 depends_on 只保证「启动顺序」，不保证「依赖已就绪」，
#      后端会在 MySQL 还没准备好时连库失败退出。
#   2. MySQL 的初始化脚本用「宿主机文件 -> 容器内 01-/02- 命名」的绑定挂载，
#      而不是复制一份到仓库里。initdb.d 目录是按文件名字典序执行的，
#      所以目标文件名必须带序号，否则 data.sql 可能先于 schema.sql 执行。
#   3. 后端用独立账号 ferry 连库，而不是 root。
#      mysql 官方镜像默认只允许 root 从 localhost 登录，
#      容器间互连（root@'172.x.x.x'）会被拒绝（Access denied）。
#   4. 不对外暴露 3306 与 8080：宿主机 3306 通常已被本机 MySQL 占用，
#      8080 也常被其他项目占用。外部只需访问前端 8088，API 由 Nginx 反代。
# ============================================================================

name: ferry

services:

  # -------------------------------------------------------------------------
  # MySQL 8：首次启动时自动执行 schema.sql + data.sql
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: ferry-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      # root 仅用于容器内运维与 healthcheck
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      # 首次启动自动建库
      MYSQL_DATABASE: ${DB_NAME:-ferry}
      # 业务账号（自动授予 DB_NAME 库的全部权限），避免后端用 root 连库。
      # 这里硬编码为 ferry，刻意不读 .env 里的 DB_USER：
      #   1) .env 的 DB_USER=root 是给「本地手动启动」连宿主机 MySQL 用的；
      #   2) mysql 官方镜像会显式拒绝 MYSQL_USER=root 并直接退出
      #      （"MYSQL_USER and MYSQL_PASSWORD are for configuring a regular user
      #        and cannot be used for the root user"）。
      MYSQL_USER: ferry
      # 容器内业务账号的口令，与「方式一」连宿主机的 DB_PASSWORD 相互独立，
      # 避免把本机 MySQL 的 root 口令复制进容器
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 注意目标文件名前缀：initdb.d 按文件名字典序执行，01 必须在 02 之前
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      # 课程正文（37 章）。之前只在本地手动导入过，导致 down -v 之后知识库是空的；
      # 放进 initdb 才能保证「一条命令起完整环境」。
      - ./backend/src/main/resources/db/knowledge_seed.sql:/docker-entrypoint-initdb.d/03-knowledge-seed.sql:ro
    healthcheck:
      # $$ 是 compose 的转义，实际传给容器 shell 的是 $MYSQL_ROOT_PASSWORD
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ferry-net

  # -------------------------------------------------------------------------
  # Redis Stack：智能助教的向量库
  # -------------------------------------------------------------------------
  # 必须用 redis-stack-server 而不是官方 redis 镜像：
  # 普通 Redis 没有 RediSearch 模块，FT.CREATE / 向量检索全部不可用
  # （spring-ai-starter-vector-store-redis 会直接报 unknown command）。
  # 校验方式：docker exec ferry-redis redis-cli MODULE LIST 应能看到 search。
  redis:
    image: redis/redis-stack-server:latest
    container_name: ferry-redis
    restart: unless-stopped
    # ⚠ 千万不要在这里覆盖 command。
    # 该镜像靠 /entrypoint.sh 用 --loadmodule 逐个加载 redisearch / rejson /
    # redisbloom 等模块；一旦把 command 改成裸 `redis-server`，模块全部不会加载，
    # 得到一个「看起来正常、但没有 search 模块」的 Redis：
    #   redis-cli MODULE LIST -> 空
    #   redis-cli FT._LIST    -> ERR unknown command
    #   后端启动时 RedisVectorStore.afterPropertiesSet 直接失败（已实测复现）。
    # 额外启动参数统一通过 REDIS_ARGS 传，entrypoint 会把它拼到启动命令末尾。
    environment:
      REDIS_ARGS: "--maxmemory 512mb --maxmemory-policy allkeys-lru"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ferry-net

  # -------------------------------------------------------------------------
  # 后端：Spring Boot 3 + Java 21
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ferry-backend:local
    container_name: ferry-backend
    restart: unless-stopped
    depends_on:
      mysql:
        # 等 healthcheck 通过，而不是仅仅「容器已启动」
        condition: service_healthy
      redis:
        # 向量库就绪后再启动：initialize-schema=true 会在启动时建索引，
        # Redis 没起来会直接导致 VectorStore 初始化失败
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-ferry}
      # 必须与 mysql 服务的 MYSQL_USER 一致，且不能是 root：
      # mysql 镜像默认只允许 root 从 localhost 登录，跨容器用 root 会被拒绝
      DB_USER: ferry
      DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-86400}
      # 向量库地址（容器内走服务名，不经过宿主机）
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 大模型密钥（硅基流动），缺省为空时应用仍可启动，只是问答接口不可用
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      TZ: Asia/Shanghai
    volumes:
      # 用户上传的简历落在卷里，容器重建不丢
      - uploads-data:/app/uploads
    healthcheck:
      # /api/course/list 是公开接口，不需要 token，适合做存活探测
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/course/list > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - ferry-net

  # -------------------------------------------------------------------------
  # 前端：Nginx 托管静态资源 + 反代 /api 与 /uploads
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ferry-frontend:local
    container_name: ferry-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 宿主 8088 -> 容器 80，避开常被占用的 8080
      - "${FRONTEND_PORT:-8088}:80"
    networks:
      - ferry-net

volumes:
  mysql-data:
    name: ferry-mysql-data
  uploads-data:
    name: ferry-uploads
  # Redis 持久化：向量索引可重建（重灌数据即可），但保留 RDB 能避免每次重启都重算 embedding
  redis-data:
    name: ferry-redis-data

networks:
  ferry-net:
    name: ferry-net
    driver: bridge
