[pytest]
# UI 自动化用例统一打 ui 标记，默认不参与执行。
#
#   跑接口测试（原有 196 条）      pytest
#   跑 UI 自动化（需前端+后端已启动） pytest -m ui
#   全跑                          pytest -m ""
#
# 之所以默认排除：UI 用例需要额外启动前端 dev server (5173) 与真实浏览器，
# 单条耗时在秒级，混进接口回归会拖慢原本 5 秒跑完的流程。
addopts = -m "not ui"

markers =
    ui: Selenium UI 自动化用例（需前端 5173 与后端 8080 均已启动）
