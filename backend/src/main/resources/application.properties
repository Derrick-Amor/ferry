# ============================================================
# 渡口 Ferry · 后端应用配置
# ------------------------------------------------------------
# 安全约定：
#   数据库口令、JWT 密钥等敏感项不在本文件写明文，
#   一律通过环境变量注入。形如 ${VAR:default} 表示：
#     优先读取环境变量 VAR，未设置时回退到 default。
#   default 仅用于本地开发，生产环境必须覆盖。
#   完整环境变量清单与说明见仓库根目录 .env.example。
# ============================================================

# ---- 服务端口 ----
server.port=8080

# ---- 应用名称 ----
spring.application.name=ferry-backend

# ---- 数据源（MySQL 8）----
# 相关环境变量：DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD
# 建表与种子数据脚本：src/main/resources/db/schema.sql、src/main/resources/db/data.sql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ferry}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- Jackson 时区 ----
# 日期时间格式（yyyy-MM-dd HH:mm:ss）由 seb.config.JacksonConfig 统一管理，此处不再声明
# spring.jackson.date-format：该配置只对 java.util.Date 生效，对项目使用的 LocalDateTime 无效，
# 留着会让人误以为格式由配置控制，实际由 JavaTimeModule 接管。
spring.jackson.time-zone=GMT+8

# ---- MyBatis-Plus ----
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto

# ---- JWT ----
# JWT_SECRET：签名密钥，生产环境必须覆盖为足够长的随机串
# JWT_EXPIRE：令牌有效期，单位秒（默认 86400 = 24 小时）
jwt.secret=${JWT_SECRET:ferry-dev-only-secret-change-in-production}
jwt.expire=${JWT_EXPIRE:86400}

# ---- multipart 文件上传 ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Redis（智能助教的向量存储，需要 Redis Stack，普通 Redis 无 RediSearch）----
# 容器内走服务名 redis，本地开发默认 localhost
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0

# ---- 向量索引初始化 ----
# initialize-schema=true：应用启动时自动创建 RediSearch 索引（已存在则复用）。
# 索引名与 key 前缀都带 ferry 前缀，避免和同一 Redis 实例上的其它项目串数据。
spring.ai.vectorstore.redis.initialize-schema=true
spring.ai.vectorstore.redis.index-name=ferry-knowledge
spring.ai.vectorstore.redis.prefix=ferry:chunk:

# ---- AI 大模型（硅基流动 SiliconFlow）----
# 密钥通过环境变量注入，见仓库根目录 .env 的 SILICONFLOW_API_KEY
# 说明：以下配置在 S2 引入 spring-ai-openai 依赖后才会被自动装配，
#      当前仅作声明，不影响启动。
# 选型依据（均实测可用，且都在免费额度内）：
#   bge-m3            1024 维、8192 tokens，中文 MTEB 73.7，RAG 事实标准
#   Qwen3-8B          中文表达与指令遵循稳定，适合按资料作答
#   bge-reranker-v2-m3 检索后二次排序，进一步提升命中精度
spring.ai.openai.base-url=https://api.siliconflow.cn
spring.ai.openai.api-key=${SILICONFLOW_API_KEY:}
spring.ai.openai.chat.options.model=Qwen/Qwen3-8B
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.embedding.options.model=BAAI/bge-m3

# 重排模型不走 spring.ai 的标准配置，由业务层按需调用
ferry.ai.rerank-model=BAAI/bge-reranker-v2-m3
# 检索参数：召回条数与重排后保留条数
ferry.ai.retrieve-top-k=8
ferry.ai.rerank-top-n=4
