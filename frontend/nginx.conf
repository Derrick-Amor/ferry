# ============================================================================
# 渡口 Ferry · 前端站点配置
# ----------------------------------------------------------------------------
# 本文件在镜像中被放到 /etc/nginx/conf.d/default.conf，替换 Nginx 官方镜像
# 自带的默认站点配置（因此这里只需要写 server 块，不需要 http 块）。
#
# 解决三件事：
#   1. Vue Router 使用 history 模式（createWebHistory），刷新 /course/1 这类
#      子路由时 Nginx 会去找不存在的文件而 404 —— 用 try_files 回退到 index.html。
#   2. 前端 axios 的 baseURL 是 /api，必须由 Nginx 反代到后端，否则跨域。
#   3. 简历/封面等静态资源走 /uploads/**，同样由后端提供。
# ============================================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 与后端 spring.servlet.multipart.max-file-size=10MB 对齐。
    # 注意：这里是「整个请求体」上限，multipart 还会带 boundary 等额外开销，
    # 因此一个正好 10MB 的文件会被 Nginx 挡在 413，属预期行为。
    client_max_body_size 10m;

    # ---- gzip ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      application/javascript
                      application/json
                      application/xml
                      image/svg+xml;

    # ---- 后端 API ----
    # proxy_pass 不带 URI 部分，Nginx 会原样透传请求路径（/api/...），
    # 因此不需要 rewrite，后端 @RequestMapping("/api/...") 能正常匹配。
    # 注意这里用变量形式（set + proxy_pass $var$request_uri）而不是写死
    # http://backend:8080，原因是：静态 upstream 只在 nginx 启动时解析一次 DNS
    # 并永久缓存 IP；只要 backend 容器被重建（换 IP），前端就会一直 502
    # Bad Gateway，必须手动 restart frontend 才恢复。
    # 变量形式 + Docker 内置 DNS（127.0.0.11）让它按 valid=10s 重新解析。
    # 变量形式下 nginx 不会自动补 URI，所以必须显式拼上 $request_uri。
    # ---- 智能助教：SSE 流式（必须单独一块）----
    # 为什么不能复用下面的 /api/ 块：Nginx 默认会缓冲上游响应，
    # 逐字生成的 SSE 会被攒在缓冲区里，用户看到的是「转圈十秒，然后整段蹦出来」，
    # 流式就白做了。这里显式关掉缓冲与压缩（gzip 同样会攒数据）。
    # 精确匹配 `=` 的优先级高于前缀匹配 `/api/`，所以这块一定先命中。
    location = /api/assistant/chat {
        resolver            127.0.0.11 valid=10s ipv6=off;
        set $backend_sse    http://backend:8080;
        proxy_pass         $backend_sse$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        # 比后端 SseEmitter 的 180s 略长，让后端先超时、给出可读的错误事件
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
    }

    location /api/ {
        resolver            127.0.0.11 valid=10s ipv6=off;
        set $backend_api    http://backend:8080;
        proxy_pass         $backend_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # ---- 上传文件（简历、封面、头像）----
    location /uploads/ {
        resolver             127.0.0.11 valid=10s ipv6=off;
        set $backend_uploads http://backend:8080;
        proxy_pass           $backend_uploads$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- 带内容哈希的打包产物，可长缓存 ----
    # 只用 add_header 声明 Cache-Control，不再叠加 expires 指令，
    # 否则两个指令都会写 Cache-Control，产生重复响应头
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ---- SPA 路由回退 ----
    # 先找真实文件，再找目录，都没有就交给 index.html 由前端路由接管。
    # 少了这一条，刷新任何子路由都会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- index.html 不缓存，保证发版后立即生效 ----
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
